# Air-gapped / zero-egress Docker Compose stack — Sovereign Pack (#502).
#
#   cp .env.airgap.example .env.airgap
#   # fill in every REPLACE_ME, then:
#   docker compose -f docker-compose.airgap.yml --env-file .env.airgap up -d
#
# Read docs/deployment/air-gap.md first. This file is deliberately STANDALONE
# rather than an overlay on docker-compose.yml: the dev stack carries `build:`
# stanzas, and an overlay that leaves them in place will happily rebuild from
# source (pulling base images) the moment a local layer is missing — exactly
# the silent egress this stack exists to prevent. Every service here is
# `image:` only, pinned by digest, so `docker compose up` can do nothing but
# start what was side-loaded.
#
# Digests are supplied through the env file. `docker compose config` fails
# loudly on an unset one, so a half-filled env file cannot start a stack whose
# provenance you cannot state.

services:
  # ── Infrastructure ─────────────────────────────────────
  postgres:
    image: ${IMAGE_POSTGRES:?set IMAGE_POSTGRES to a digest-pinned ref}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - btagent-net

  redis:
    image: ${IMAGE_REDIS:?set IMAGE_REDIS to a digest-pinned ref}
    # Auth is opt-in: set REDIS_PASSWORD in .env.airgap (plus a matching
    # BTAGENT_REDIS_URL=redis://:<pw>@redis:6379) to start with --requirepass.
    command:
      - sh
      - -c
      - 'if [ -n "$$REDIS_PASSWORD" ]; then exec redis-server --requirepass "$$REDIS_PASSWORD"; else exec redis-server; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        # `redis-cli ping` exits 0 even on a NOAUTH error, so grep the reply.
        - 'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi'
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - btagent-net

  minio:
    image: ${IMAGE_MINIO:?set IMAGE_MINIO to a digest-pinned ref}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - btagent-net

  # Local inference + embeddings. The model blobs are NOT downloaded here —
  # `ollama pull` needs the internet. Pre-seed the `ollama-data` volume from
  # the transfer bundle (docs/deployment/air-gap.md, "Model bundle") before
  # first start; this container then serves them with no egress of its own.
  ollama:
    image: ${IMAGE_OLLAMA:?set IMAGE_OLLAMA to a digest-pinned ref}
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - btagent-net

  # ── One-shot init (must complete before the app starts) ─
  # Same image as the backend, so this adds nothing to the transfer bundle.
  migrate:
    image: ${IMAGE_BACKEND:?set IMAGE_BACKEND to a digest-pinned ref}
    # alembic.ini and migrations/ are at /app/backend (WORKDIR is /app), so
    # alembic must run from there — `exec backend alembic upgrade head` fails.
    command: ["sh", "-c", "cd backend && alembic upgrade head"]
    env_file:
      - .env.airgap
    environment:
      BTAGENT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BTAGENT_REDIS_URL: ${BTAGENT_REDIS_URL:-redis://redis:6379}
      BTAGENT_S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - btagent-net

  init-storage:
    image: ${IMAGE_BACKEND:?set IMAGE_BACKEND to a digest-pinned ref}
    # Creates BTAGENT_S3_BUCKET, which /health/ready head_buckets and every
    # evidence upload needs. In an enclave there is no console session to go
    # make it by hand, so this has to happen automatically.
    command: ["bt", "init-storage"]
    env_file:
      - .env.airgap
    environment:
      BTAGENT_S3_ENDPOINT: http://minio:9000
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    networks:
      - btagent-net

  # ── Application ────────────────────────────────────────
  backend:
    image: ${IMAGE_BACKEND:?set IMAGE_BACKEND to a digest-pinned ref}
    ports:
      - "8000:8000"
    env_file:
      - .env.airgap
    environment:
      BTAGENT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BTAGENT_REDIS_URL: ${BTAGENT_REDIS_URL:-redis://redis:6379}
      BTAGENT_S3_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      init-storage:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/health'); r.raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - btagent-net

  scheduler:
    image: ${IMAGE_BACKEND:?set IMAGE_BACKEND to a digest-pinned ref}
    command: ["arq", "btagent_backend.scheduler.worker.WorkerSettings"]
    env_file:
      - .env.airgap
    environment:
      BTAGENT_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BTAGENT_REDIS_URL: ${BTAGENT_REDIS_URL:-redis://redis:6379}
      BTAGENT_S3_ENDPOINT: http://minio:9000
    # The image HEALTHCHECK curls :8000, which an arq worker does not serve, so
    # without this override a healthy scheduler always reads "unhealthy".
    healthcheck:
      test: ["CMD", "arq", "--check", "btagent_backend.scheduler.worker.WorkerSettings"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      init-storage:
        condition: service_completed_successfully
    networks:
      - btagent-net

  frontend:
    image: ${IMAGE_FRONTEND:?set IMAGE_FRONTEND to a digest-pinned ref}
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - btagent-net

  nginx:
    image: ${IMAGE_NGINX:?set IMAGE_NGINX to a digest-pinned ref}
    ports:
      - "8080:80"
      # No 443 mapping: nginx/nginx.conf ships an HTTP server block only, so
      # the published port answered nothing. Add the 443 server block per
      # docs/DEPLOYMENT.md ("Enabling TLS on the compose nginx") and re-add
      # `- "8443:443"` here at the same time.
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS material issued by the enclave CA — public ACME is unreachable.
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - btagent-net

networks:
  btagent-net:
    driver: bridge
    # No `internal: true` here: the stack publishes ports to the host, and an
    # internal bridge would break that. Confining the HOST is the operator's
    # job (see the host-firewall section of the air-gap guide) — a compose
    # network flag is not an air-gap control and this file will not pretend
    # otherwise.

volumes:
  postgres-data:
  redis-data:
  minio-data:
  ollama-data:
