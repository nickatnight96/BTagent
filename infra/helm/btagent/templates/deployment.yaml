apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "btagent.fullname" . }}-backend
  labels:
    {{- include "btagent.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "btagent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "btagent.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "btagent.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "btagent.fullname" . }}-config
            - secretRef:
                name: {{ include "btagent.fullname" . }}-secret
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "btagent.fullname" . }}-frontend
  labels:
    {{- include "btagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontendReplicaCount }}
  selector:
    matchLabels:
      {{- include "btagent.frontendSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "btagent.frontendSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "btagent.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: frontend
          # Hardened nginx on Kubernetes (#399). The shared .Values.securityContext
          # drops ALL capabilities and runs readOnlyRootFilesystem, which makes the
          # nginx frontend CrashLoopBackOff two ways:
          #   1. nginx binds :80 (a privileged port the image's config listens on),
          #      but with NET_BIND_SERVICE dropped a non-root process cannot bind it.
          #   2. nginx must write its pid + cache/temp files, but the root fs is
          #      read-only with no writable mount for those paths.
          # Fix, keeping the hardened posture intact (non-root, readOnlyRootFilesystem,
          # no privilege escalation, every other capability dropped): add back ONLY
          # NET_BIND_SERVICE so the non-root process can bind :80, and mount emptyDir
          # volumes over the dirs nginx writes to. This does NOT reference
          # .Values.securityContext because that block cannot express a per-container
          # capability add without a merge; the values below mirror it exactly plus
          # the single added capability.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          image: "{{ .Values.frontendImage.repository }}:{{ .Values.frontendImage.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.frontendImage.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.frontendResources | nindent 12 }}
          # Writable scratch mounts required under readOnlyRootFilesystem: nginx
          # writes its pid to /var/run, proxy/fastcgi/etc. temp files under
          # /var/cache/nginx, and may use /tmp.
          volumeMounts:
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
# -- Scheduler / arq worker Deployment
# Runs the arq background-worker process (scheduled hunts, behavioral-baseline
# builds, stale-suppression sweeps). Uses the same backend image but overrides
# the entrypoint to launch the arq worker instead of uvicorn.
#
# SINGLE REPLICA ONLY: arq cron jobs must not double-fire. Leader election for
# distributed scheduling is not implemented; keep replicaCount at 1 until a
# distributed-lock/cron-leader pattern is added.
{{- if .Values.scheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "btagent.fullname" . }}-scheduler
  labels:
    {{- include "btagent.labels" . | nindent 4 }}
    app.kubernetes.io/component: scheduler
spec:
  # Single replica — see note above about cron double-fire risk.
  replicas: {{ .Values.scheduler.replicaCount }}
  selector:
    matchLabels:
      {{- include "btagent.schedulerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "btagent.schedulerSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "btagent.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: scheduler
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # arq worker — not an HTTP server, so no ports or httpGet probes.
          command: ["arq", "btagent_backend.scheduler.worker.WorkerSettings"]
          envFrom:
            - configMapRef:
                name: {{ include "btagent.fullname" . }}-config
            - secretRef:
                name: {{ include "btagent.fullname" . }}-secret
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
