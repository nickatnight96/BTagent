{{- if .Values.externalSecrets.enabled -}}
{{- /*
  Fail the render, not the deploy, on the three misconfigurations that would
  otherwise produce a chart that installs cleanly and then does not work.
*/ -}}
{{- if not .Values.externalSecrets.secretStoreRef.name }}
{{- fail "externalSecrets.enabled is true but externalSecrets.secretStoreRef.name is empty; set it to the SecretStore/ClusterSecretStore that fronts your secret backend" }}
{{- end }}
{{- if and (not .Values.externalSecrets.data) (not .Values.externalSecrets.dataFrom) }}
{{- fail "externalSecrets.enabled is true but neither externalSecrets.data nor externalSecrets.dataFrom is set; that renders an ExternalSecret which syncs an empty Secret, and the backend would start with no BTAGENT_DATABASE_URL" }}
{{- end }}
{{- range $key, $value := .Values.secretEnv }}
{{- if $value }}
{{- fail (printf "externalSecrets.enabled is true, but secretEnv.%s carries a literal value. With external-secrets on, secretEnv is not rendered at all — that credential would be silently ignored while still sitting in plaintext in values. Move it into the secret backend and clear it here." $key) }}
{{- end }}
{{- end }}
apiVersion: {{ .Values.externalSecrets.apiVersion }}
kind: ExternalSecret
metadata:
  name: {{ include "btagent.fullname" . }}-secret
  labels:
    {{- include "btagent.labels" . | nindent 4 }}
  {{- if .Values.migrations.enabled }}
  annotations:
    # Mirrors secret.yaml's hook annotations for the same reason: the migrate
    # Job (pre-install/pre-upgrade, weight 5) reads BTAGENT_DATABASE_URL via
    # `envFrom`, so the object that produces it has to exist first. Weight -6
    # puts the ExternalSecret one group ahead of the ConfigMap/Secret at -5,
    # giving the operator a head start on its first reconcile.
    #
    # This does not fully close the race — Helm treats an unknown CRD as ready
    # the moment it is created, so the migrate Job can still start before the
    # operator has written the target Secret. It self-heals rather than
    # failing: a pod whose `envFrom` Secret is missing sits in
    # CreateContainerConfigError and kubelet keeps retrying container creation
    # *within the same pod*, so it starts as soon as the sync lands. That
    # retry does not consume `migrations.backoffLimit`; the real bound is
    # `migrations.activeDeadlineSeconds` (600s by default), which is ample for
    # a reconcile but will fail the install if the store is unreachable —
    # which is the correct outcome.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-6"
    "helm.sh/hook-delete-policy": before-hook-creation
  {{- end }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name | quote }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    # Deliberately the same name secret.yaml would have produced, so every
    # consumer (backend + scheduler Deployments, migrate Job, backup CronJob)
    # keeps its existing `secretRef` and none of them need to know which of
    # the two paths populated it.
    name: {{ include "btagent.secretName" . }}
    creationPolicy: {{ .Values.externalSecrets.target.creationPolicy }}
    # Retain: deleting the ExternalSecret must not yank the Secret out from
    # under running pods.
    deletionPolicy: {{ .Values.externalSecrets.target.deletionPolicy }}
  {{- with .Values.externalSecrets.data }}
  data:
    {{- range $key, $ref := . }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $ref.key | quote }}
        {{- with $ref.property }}
        property: {{ . | quote }}
        {{- end }}
        {{- with $ref.version }}
        version: {{ . | quote }}
        {{- end }}
    {{- end }}
  {{- end }}
  {{- with .Values.externalSecrets.dataFrom }}
  dataFrom:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
