title: Suspicious Certutil Encode Command
id: e2a9a1b6-4b1e-4e0e-9d33-2f4b8f7f0c11
status: test
description: |
  Detects the use of certutil.exe to base64-encode a file, a common staging
  step for exfiltration or for smuggling a payload past content inspection.
references:
  - https://attack.mitre.org/techniques/T1027/
author: Vendored SigmaHQ-style sample (BTagent test fixture)
date: 2026-01-12
tags:
  - attack.defense-evasion
  - attack.t1027
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\certutil.exe'
    CommandLine|contains:
      - ' -encode '
      - ' /encode '
  condition: selection
falsepositives:
  - Administrative certificate handling scripts
level: medium
