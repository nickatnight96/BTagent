title: Azure Key Vault Mass Secret Read — Credential Harvesting
id: 6a971fa4-b82d-4dd7-a01f-5b50b6242763
status: test
description: >
  Detects SecretGet operations against Azure Key Vault (the data-plane read that
  returns a secret value, surfaced in the Activity/diagnostic log).  After
  compromising an identity, adversaries sweep the vault to harvest connection
  strings, certificates, and API keys for lateral movement.  Pair with a
  per-caller rate/threshold rule in the SIEM to surface the bulk-read burst rather
  than a single legitimate read.
references:
  - https://attack.mitre.org/techniques/T1555/006/
  - https://attack.mitre.org/techniques/T1552/
author: BTagent (#117)
date: 2026-07-27
logsource:
  product: azure
  service: activitylog
detection:
  selection:
    operationName|contains:
      - Microsoft.KeyVault/vaults/secrets/getSecret
      - SecretGet
  condition: selection
falsepositives:
  - Managed identities that legitimately read many secrets at startup (scope out the app's object id and tune the burst threshold)
level: high
tags:
  - attack.credential-access
  - attack.t1555.006
  - attack.t1552
  - cloud.control-plane
