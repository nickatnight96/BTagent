title: GCP Secret Manager Mass Access — Credential Harvesting
id: 28fc6342-99d8-453e-9894-71abf36d09cc
status: test
description: >
  Detects AccessSecretVersion calls against GCP Secret Manager — the read that
  returns the plaintext payload.  After compromising a principal, adversaries
  sweep Secret Manager to harvest service-account keys, DB passwords, and API
  tokens for lateral movement.  Pair with a per-principal rate/threshold rule in
  the SIEM to surface the bulk-read burst rather than a single legitimate read.
references:
  - https://attack.mitre.org/techniques/T1555/006/
  - https://attack.mitre.org/techniques/T1552/
author: BTagent (#117)
date: 2026-07-27
logsource:
  product: gcp
  service: audit
detection:
  selection:
    protoPayload.methodName:
      - google.cloud.secretmanager.v1.SecretManagerService.AccessSecretVersion
      - google.cloud.secretmanager.v1beta1.SecretManagerService.AccessSecretVersion
  filter_workload:
    protoPayload.authenticationInfo.principalEmail|endswith:
      - gke-workload@iam.gserviceaccount.com
      - run-app@iam.gserviceaccount.com
  condition: selection and not filter_workload
falsepositives:
  - Workload identities that legitimately read many secrets at startup (scope filter_workload to the app service account and tune the burst threshold)
level: high
tags:
  - attack.credential-access
  - attack.t1555.006
  - attack.t1552
  - cloud.control-plane
