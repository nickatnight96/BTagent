title: Secrets Manager Mass Read — Credential Harvesting
id: 0c67d37e-7ea5-4920-9ea3-9df764dfdf24
status: test
description: >
  Detects bulk retrieval from AWS Secrets Manager: a BatchGetSecretValue call, or
  a GetSecretValue burst against many secrets from a single principal.  After
  gaining a foothold, adversaries sweep the cloud secret store to harvest database
  passwords, API keys, and cross-service credentials for lateral movement.  Pair
  with a rate/threshold rule in the SIEM (many GetSecretValue calls per principal
  per window) for the burst variant.
references:
  - https://attack.mitre.org/techniques/T1555/006/
  - https://attack.mitre.org/techniques/T1552/
author: BTagent (#117)
date: 2026-07-27
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_batch:
    eventName: BatchGetSecretValue
  selection_single:
    eventName: GetSecretValue
  filter_known_service:
    userIdentity.arn|contains:
      - ':assumed-role/EcsTaskSecretsRole'
      - ':assumed-role/LambdaSecretsRole'
  condition: (selection_batch or selection_single) and not filter_known_service
falsepositives:
  - Application startup that legitimately reads many secrets (scope filter_known_service to the app's task role and tune the burst threshold)
level: high
tags:
  - attack.credential-access
  - attack.t1555.006
  - attack.t1552
  - cloud.control-plane
